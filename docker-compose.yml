services:
  db:
    image: postgres:17-alpine
    container_name: jogae-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jogae
      POSTGRES_PASSWORD: jogae
      POSTGRES_DB: jogae
    ports:
      - "5433:5432"
    volumes:
      - jogae-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jogae -d jogae"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jogae-pgdata:
